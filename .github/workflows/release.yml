name: Release

# Cut a versioned GitHub Release with the .deb package attached.
#
# Trigger: pushing a version tag (e.g. v1.0) — conventionally on the `release`
# branch, which is the stable snapshot of a released version.
#
# Release procedure:
#   1. Make sure `release` is at the exact commit you want to ship, and that
#      project(... VERSION x.y) in CMakeLists.txt matches the version.
#   2. Tag it and push the tag:
#          git checkout release
#          git tag v1.0
#          git push origin v1.0
#   3. This workflow builds the .deb and publishes it under the Releases tab.

on:
  push:
    tags:
      - 'v*'

# gh release create needs write access to create the release and upload assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The third-party libraries are git submodules — needed to build.
          submodules: recursive
          fetch-depth: 0

      - name: Build the .deb package
        run: bash build.sh deb

      - name: Verify the package version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"                       # v1.0 -> 1.0
          deb="$(ls build/ultragps-xy_*_amd64.deb)"
          pkgver="$(dpkg-deb -f "$deb" Version)"
          echo "tag version: $tag   package version: $pkgver"
          if [ "$tag" != "$pkgver" ]; then
            echo "::error::Tag ($tag) does not match the package version ($pkgver). \
          Bump project(VERSION) in CMakeLists.txt to match the tag before releasing." >&2
            exit 1
          fi
          echo "DEB_PATH=$deb" >> "$GITHUB_ENV"

      - name: Create the GitHub Release and upload the .deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$DEB_PATH" \
            --title "UltraGPS Ground Station $GITHUB_REF_NAME" \
            --generate-notes
